[package]
name = "uetl-compiler"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Compiler that transforms UETL (Universal Email Templating Language) into cross-client HTML"
repository = "https://github.com/vitry17/uetl-compiler"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1"
tower-http = { version = "0.5", features = ["cors", "trace", "timeout"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
criterion = "0.5"

[[bench]]
name = "compile"
harness = false
