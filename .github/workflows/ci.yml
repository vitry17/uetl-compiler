name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Vérifie licences et avis de sécurité des dépendances (voir deny.toml) —
      # job séparé : un `cargo update` amont qui introduit une dépendance non
      # conforme ne doit pas être noyé dans le bruit d'un job de test par
      # ailleurs vert, ni bloquer sur un composant clippy/rustfmt sans rapport.
      - uses: EmbarkStudios/cargo-deny-action@v2
