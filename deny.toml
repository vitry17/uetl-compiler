[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Licences permissives standard de l'écosystème Rust — la même famille que
# le choix MIT/Apache-2.0 fait pour ce dépôt (voir README.md#License).
# Ajuster cette liste au fil des dépendances plutôt que d'utiliser un
# `confidence-threshold` bas ou une liste ouverte : le but est justement
# qu'une dépendance à la licence copyleft ou inconnue casse la CI, pas
# qu'elle passe silencieusement.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
